<nav>
  <a routerLink="/">Motorcycle List</a>
  |
  <a routerLink="/motorcycles/add">Add Motorcycle</a>
  <!-- Change the editing lock -->
  <button
    type="button"
    (click)="editGuardService.changeGuard()">
    {{ editGuardService.guardEnabled()
    ? 'Editing locked — Unlock'
    : 'Editing unlocked — Lock' }}
  </button>
  @if (loadingService.isLoading()) {
    <span>Loading...</span>
  }

  @if (errorService.errorMessage()) {
    <div role="alert">
      <p>{{ errorService.errorMessage() }}</p>

      <button type="button" (click)="errorService.clearMessage()">
        Dismiss
      </button>
    </div>
  }
</nav>

<router-outlet></router-outlet>
