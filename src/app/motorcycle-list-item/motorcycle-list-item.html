<div class="motorcycle-item-style">

  <h2>{{ motorcycle().title }}</h2>

  <img
    [src]="motorcycle().thumbnail"
    [alt]= "motorcycle().title" >

  <p>ID: {{ motorcycle().id }}</p>
  <p>Brand: {{ motorcycle().brand }}</p>
  <p>Price: {{ motorcycle().price }}</p>
  <p>Category: {{ motorcycle().category }}</p>

  <a
    [routerLink]="['/motorcycles', motorcycle().id]"
    (click)="$event.stopPropagation()">
    View Details
  </a>

  <!--Open the edit form -->
  <button type="button"
          [routerLink]="['/motorcycles/edit',
          motorcycle().id]"
          (click)="$event.stopPropagation()">
    Edit
  </button>

  <!-- Delete button -->
  <button type="button" (click)="openMotorcycle()">
    Delete
  </button>
</div>
