<h1>Motorcycle Details</h1>

@if (motorcycle(); as item) {
  <h2>{{ item.title }}</h2>

  <img src="item.thumbnail" alt="item.title">

  <p>ID: {{ item.id }}</p>
  <p>Brand: {{ item.brand }}</p>
  <p>Price: {{ item.price }}</p>
  <p>Category: {{ item.category }}</p>
} @else {
  <p>Motorcycle not found!</p>
}
